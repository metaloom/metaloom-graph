# Logging for metaloom-graph-cli (slf4j-simple, stderr). Warnings and errors only: the CLI reports its own
# progress, and stdout may be carrying a dump. Raise it for a look inside: -Dorg.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.levelInBrackets=true
