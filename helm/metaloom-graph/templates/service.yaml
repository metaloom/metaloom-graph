apiVersion: v1
kind: Service
metadata:
  name: {{ include "graph.fullname" . }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- if and .Values.wire.enabled (not .Values.wire.tls.only) }}
    # Present even when wire.host is loopback, so that widening it is one value change rather than
    # two. Nothing outside the pod can reach it until then.
    - name: wire
      port: {{ .Values.service.wirePort }}
      targetPort: wire
      protocol: TCP
    {{- end }}
    {{- if and .Values.wire.enabled .Values.wire.tls.enabled }}
    - name: wire-tls
      port: {{ .Values.service.wireTlsPort }}
      targetPort: wire-tls
      protocol: TCP
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- if .Values.mcp.enabled }}
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
    {{- end }}
  selector:
    {{- include "graph.selectorLabels" . | nindent 4 }}
