{{- if .Values.ingress.enabled -}}
{{/*
  This is also where TLS for the HTTP port belongs -- the server terminates none of its own, and
  ingress.tls is the value that fixes it. wire.tls is the BINARY port and does nothing for this one.

  With auth.enabled false there is no authentication behind this at all: an Ingress makes the browser
  UI and /api/query reachable from outside the cluster, and with graph.allowWrite on it makes the
  delete path reachable too.

  Only the HTTP port is ever exposed here. The monitoring port carries database names and store sizes,
  and the MCP port is a remote code path an LLM drives; neither belongs behind a public hostname.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graph.fullname" . }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "graph.fullname" $ }}
                port:
                  number: {{ $.Values.service.httpPort }}
          {{- end }}
    {{- end }}
{{- end }}
