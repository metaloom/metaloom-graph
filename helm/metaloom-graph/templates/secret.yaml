{{- /*
  The first administrator's password.

  Rendered only when `auth.initialPassword` is set and no `auth.existingSecret` was named, because those are the two
  ways to supply one and a chart that created a Secret alongside a reference to somebody else's would be ambiguous
  about which one wins.

  With neither, the server generates a password on its first start and prints it to standard output — which in a pod is
  the container log, so `kubectl logs` is where to read it and rotating it afterwards is the sensible next step.
  NOTES.txt says so.
*/ -}}
{{- if and .Values.auth.enabled .Values.auth.initialPassword (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graph.fullname" . }}-auth
  labels:
    {{- include "graph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.initialPassword | quote }}
{{- end }}
