{{/*
  A StatefulSet needs a governing headless Service to give its pod a stable DNS name. Separate from
  the main Service because that one may be a LoadBalancer, and a headless Service cannot be.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "graph.fullname" . }}-headless
  labels:
    {{- include "graph.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
  selector:
    {{- include "graph.selectorLabels" . | nindent 4 }}
