{{- include "graph.validateReplicas" . -}}
{{/*
  A StatefulSet and not a Deployment, and the reason is in the storage engine rather than in taste.

  The store holds a LOCK file, allows exactly one writer process, and memory-maps its segments.
  A Deployment's default RollingUpdate starts the replacement pod BEFORE the old one terminates, so
  for a few seconds two processes hold the same ReadWriteOnce volume: the new one fails to take the
  lock and crash-loops while the old one is still serving, which reads as a broken image rather than
  as the ordering mistake it is. `OrderedReady` with one replica means the old pod is fully gone
  before the new one starts.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "graph.fullname" . }}
  labels:
    {{- include "graph.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "graph.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "graph.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "graph.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "graph.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must exceed the server's own budget: 5s draining running queries, 2s letting abandoned ones
      # unwind, then a checkpoint. Nothing committed is at risk if this is too short — the log is
      # fsynced before any data page is touched — but the close is less clean and recovery longer.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: graph
          image: {{ include "graph.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            {{- if .Values.wire.enabled }}
            - name: wire
              containerPort: {{ .Values.service.wirePort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.mcp.enabled }}
            - name: mcp
              containerPort: {{ .Values.service.mcpPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: GRAPH_ROOT
              value: /data
            - name: GRAPH_HTTP_PORT
              value: {{ .Values.service.httpPort | quote }}
            - name: GRAPH_DATABASE
              value: {{ .Values.graph.database | quote }}
            - name: GRAPH_ALLOW_WRITE
              value: {{ .Values.graph.allowWrite | quote }}
            - name: GRAPH_ALLOW_DROP
              value: {{ .Values.graph.allowDrop | quote }}
            {{- if .Values.graph.allowLoadCsv }}
            - name: GRAPH_ALLOW_LOAD_CSV
              value: "true"
            - name: GRAPH_IMPORT_DIR
              value: {{ required "graph.importDir is required when graph.allowLoadCsv is on: LOAD CSV reads one directory and there is no default" .Values.graph.importDir | quote }}
            {{- end }}
            - name: GRAPH_ALLOW_BACKUP
              value: {{ .Values.graph.allowBackup | quote }}
            - name: GRAPH_DEMO
              value: {{ .Values.graph.demo | quote }}
            {{- if .Values.graph.demo }}
            - name: GRAPH_DEMO_SIZE
              value: {{ .Values.graph.demoSize | quote }}
            {{- end }}
            - name: GRAPH_QUERY_TIMEOUT_MILLIS
              value: {{ .Values.graph.queryTimeoutMillis | quote }}
            - name: GRAPH_SLOW_QUERY_MILLIS
              value: {{ .Values.graph.slowQueryMillis | quote }}
            - name: GRAPH_MAX_STREAMS
              value: {{ .Values.graph.maxStreams | quote }}
            - name: GRAPH_WIRE_ENABLED
              value: {{ .Values.wire.enabled | quote }}
            {{- if .Values.wire.enabled }}
            - name: GRAPH_WIRE_PORT
              value: {{ .Values.service.wirePort | quote }}
            # Loopback unless deliberately widened: the port has no authentication, so the Service
            # port existing is not the same as it being reachable, and that is on purpose.
            - name: GRAPH_WIRE_HOST
              value: {{ .Values.wire.host | quote }}
            {{- end }}
            - name: GRAPH_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: GRAPH_METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            {{- end }}
            - name: GRAPH_MCP_ENABLED
              value: {{ .Values.mcp.enabled | quote }}
            {{- if .Values.mcp.enabled }}
            - name: GRAPH_MCP_PORT
              value: {{ .Values.service.mcpPort | quote }}
            - name: GRAPH_MCP_HOST
              value: {{ .Values.mcp.host | quote }}
            {{- end }}
            # Authentication. On by default, which is the server's own default: the HTTP, binary and MCP ports then
            # require a login and the monitoring port deliberately does not, because a kubelet probe and a scrape carry
            # no credential and a probe failing over a misconfigured secret would be a restart loop.
            - name: GRAPH_AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: GRAPH_SESSION_TIMEOUT_MILLIS
              value: {{ .Values.auth.sessionTimeoutMillis | quote }}
            {{- if or .Values.auth.initialPassword .Values.auth.existingSecret }}
            # secretKeyRef and never a literal: an env var set with `value:` is visible in `kubectl describe pod` and
            # in /proc/<pid>/environ to anything sharing the namespace.
            - name: GRAPH_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "graph.fullname" .)) }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          # Recovery is a single redo pass and normally takes milliseconds — but after a crash during
          # a large bulk load it can take minutes, and a liveness probe firing during it produces a
          # crash loop that can never finish recovering. The startup probe is what buys that time.
          startupProbe:
            {{- if and .Values.metrics.enabled .Values.probes.useHealthEndpoint }}
            httpGet:
              path: /health
              port: metrics
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          # On the MONITORING port, never the query port. A query load heavy enough to saturate HTTP
          # would otherwise time out the probe and get a merely-busy server killed — turning a slow
          # database into a restart loop.
          livenessProbe:
            {{- if and .Values.metrics.enabled .Values.probes.useHealthEndpoint }}
            httpGet:
              path: /health
              port: metrics
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # /ready turns 503 as soon as shutdown begins, which is what takes this pod out of the
          # Service's endpoints BEFORE the listener closes. Without it every rolling update drops the
          # connections that arrive in the gap. A tcpSocket fallback cannot express that at all.
          readinessProbe:
            {{- if and .Values.metrics.enabled .Values.probes.useHealthEndpoint }}
            httpGet:
              path: /ready
              port: metrics
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # Not optional when readOnlyRootFilesystem is on, and not merely for scratch: the native
            # library is unpacked to java.io.tmpdir and then dlopen()ed. Without a writable, executable
            # /tmp the whole native layer fails to load — silently, reporting "failed to load" in
            # /api/stats and falling back to pure Java.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
