apiVersion: v2
name: metaloom-graph
description: MetaLoom // Graph — a native-code backed graph database with an openCypher subset
type: application
home: https://metaloom.io/graph
sources:
  - https://github.com/metaloom/metaloom-graph
keywords:
  - graph
  - database
  - cypher
maintainers:
  - name: MetaLoom

#
# Changelog, newest first. Kept here rather than in a separate file so that whoever bumps the version
# has to look at what changed, and so `helm show chart` carries it.
#
#   0.1.0-alpha.1  First release, with MetaLoom // Graph 0.1.0-alpha.1. StatefulSet with one
#                  replica, four ports, /health and /ready probes. A pre-release version on purpose:
#                  Helm skips it unless asked with --devel or an explicit --version. NOT upgradeable
#                  from anything, and note that persistence.size cannot be changed by a `helm upgrade`
#                  — a volumeClaimTemplate is immutable once the StatefulSet exists.
#
version: 0.1.0-alpha.1

# The image tag the chart deploys when image.tag is empty: the release this chart version was cut
# with, never "latest", so the same chart version always deploys the same image. Kept equal to the
# project version in the root pom.xml; build.sh refuses a release where the two disagree.
appVersion: "0.1.0-alpha.1"
