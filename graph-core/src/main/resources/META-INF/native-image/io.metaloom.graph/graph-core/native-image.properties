# What the storage engine needs from native-image, carried by the jar so that any image containing
# graph-core gets it without the embedder having to know. See spec/GRAALVM.md.
#
# SharedArenaSupport is the load-bearing one: every segment file is mapped through an Arena.ofShared
# (SegmentFile.open), and without this flag closing one fails at run time with
# "Support for Arena.ofShared is not active". It is still an experimental option in GraalVM 25, hence
# the unlock.
#
# enable-native-access silences the restricted-method warning that java.lang.foreign.Linker prints on
# first use; it does not change behaviour.
Args = -H:+UnlockExperimentalVMOptions \
       -H:+SharedArenaSupport \
       --enable-native-access=ALL-UNNAMED
