# Performance gates, enforced by PerformanceGateTest under `mvn test -Pbench`.
#
# Each `min.*` is a floor in operations per second and each `max.*` is a ceiling on reads or bytes per operation.
# A build fails when a number crosses its gate.
#
# THE FLOORS ARE DELIBERATELY LOW — roughly 40 percent of what the reference machine measures. These are timing
# loops on a shared, frequency-scaling desktop, not JMH on a quiet box, and a gate set near the measured value
# would fail on load rather than on regression. What this catches is the class of change that costs an order of
# magnitude: an added lookup on the read path, a lock on a hot path, an fsync per operation. That is the failure
# worth failing a build over; a fifteen percent drift is not detectable here and pretending otherwise would make
# the gate noise.
#
# The `max.*` gates are the opposite: they are exact, because a read count is deterministic. TESTING.md section 7
# is explicit that throughput alone is not enough — a change that goes faster while touching more structure has
# made things worse — so both halves are gated.
#
# Reference measurements are in spec/reports/BASELINE.md. Update these numbers only with a measurement and a reason.

# --- throughput floors, operations per second
min.nodeReadById=2000000
min.nodePropertiesRead=1000000
min.nodeCreateBatched=80000
min.nodeCreateDurableCommit=200
min.edgeCreateBatched=400000
min.neighboursDegreeOne=800000
min.indexedLookup=100000

# --- structural ceilings, exact
max.reads.nodeReadById=1
max.reads.nodePropertiesRead=2
max.reads.adjacency.degreeTwo=0
max.reads.adjacency.degree4000=1
max.writeAmplification.bulkLoad=3.0

# Compaction is gated on wall clock for a fixed workload, not on relocations per second. The reference sweep runs
# once per batch over every live record whether one record moved or a thousand, so a rate computed from the
# relocation count says more about how much needed moving than about how fast the engine is.
max.compactionMillis=5000
