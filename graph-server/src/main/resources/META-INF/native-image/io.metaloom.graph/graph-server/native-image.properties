# What the server needs on top of what graph-core's copy of this file already asks for.
#
# logback and slf4j must be initialised at build time, because netty holds its loggers in static final
# fields of classes that native-image does initialise at build time. Leaving logback at run time fails
# the build with "An object of type 'ch.qos.logback.classic.Logger' was found in the image heap".
#
# The consequence is that the logging configuration is baked into the binary: -Dlogback.configurationFile
# at run time has no effect on the image. See spec/GRAALVM.md section 6.
Args = --initialize-at-build-time=ch.qos.logback,org.slf4j
