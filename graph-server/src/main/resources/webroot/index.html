<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph browser</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>Graph browser</h1>
  <div id="stats" class="stats">connecting…</div>
</header>

<main>
  <section class="editor">
    <label for="query" class="visually-hidden">Cypher query</label>
    <textarea id="query" spellcheck="false" rows="4"
      placeholder="MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 50">MATCH (n)-[r]->(m) RETURN n, r, m LIMIT 50</textarea>
    <div class="controls">
      <button id="run" type="button">Run</button>
      <span class="hint">Ctrl/Cmd + Enter</span>
      <span id="timing" class="timing"></span>
    </div>
    <div id="examples" class="examples"></div>
  </section>

  <div id="error" class="error" hidden></div>

  <section class="results">
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="graph" role="tab">Graph</button>
      <button class="tab" data-view="table" role="tab">Table</button>
    </div>

    <div id="graph-view" class="view">
      <svg id="canvas"></svg>
      <div id="graph-empty" class="empty" hidden>
        This result has no nodes to draw. Return a node, relationship or path — for example
        <code>RETURN n</code> rather than <code>RETURN n.name</code>.
      </div>
      <aside id="inspector" class="inspector" hidden></aside>
    </div>

    <div id="table-view" class="view" hidden>
      <div id="table-wrap"></div>
    </div>
  </section>
</main>

<script src="vendor/d3.v7.min.js"></script>
<script src="app.js"></script>
</body>
</html>
